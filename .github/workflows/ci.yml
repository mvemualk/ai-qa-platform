name: AI QA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -v

  ai-eval-suite:
    runs-on: ubuntu-latest
    needs unit-tests
    continue-on-error: true
    if: ${{ github.event_name == 'push' }}
    defaults:
      run:
        working-directory: backend
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Start API server
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 3
      - name: Run full AI test suite (eval + hallucination + security)
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        run: |
          curl -s -X POST http://localhost:8000/api/evaluate/run -o results.json
          python ../scripts/render_report.py results.json report.html
      - name: Upload HTML report
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ai-qa-report
          path: backend/report.html
